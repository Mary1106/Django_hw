{% extends 'catalog/base.html'%}
{% load my_tags %}

{% block title %}
Зарегистрироваться
{% endblock %}



{% block content %}


<div class="container">
    <form method = "post" class = "row" enctype="multipart/form-data">
        <div class = "col-6">
            <div class = "card">
                <div class = "card-text" align="center">
                    Регистрация
                </div>
                <div class = "card-body">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class = "btn btn-primary">
                        Зарегистрироваться
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
