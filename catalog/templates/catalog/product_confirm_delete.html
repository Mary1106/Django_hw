
{% extends 'catalog/base.html'%}
{% load my_tags %}

{% block title %}<h1> Удалить товар </h1>{% endblock %}

{% block content %}

<div class="container">
    <form method="POST" class = "row" enctype="multipart/form-data">
        <div class="col-6">
            <div class="card">
                <div class = "card-text" align="center">
                <p><br>Вы действительно хотите удалить продукт?</p>
                </div>
                <div class = "card-body" align="center">
                    {% csrf_token %}
                    {{ form.as_p }}
                <button type="submit" class = "btn btn-danger"> Удалить </button>
                <a class="btn btn-primary" href="{% url 'catalog:product_list' %}" role="button">Отмена</a>
                </div>
            </div>
        </div>
    </form>
</div>

{% endblock %}
