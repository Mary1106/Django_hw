
{% extends 'catalog/base.html'%}
{% load my_tags %}

{% block title %}<h1> Добавить товар </h1>{% endblock %}

{% block content %}

<div class="container">
    <form method="POST" enctype="multipart/form-data">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <div class="col">
            <div class="card shadow-sm">
                {% csrf_token %}
                {{ form.as_p }}

            <button type="submit" class = "btn btn-primary">
                {% if object %}
                Сохранить изменения
                {% else %}
                Добавить продукт
                {% endif %}
            </button>
            </div>
        </div>
    </div>
    </form>
</div>


{% endblock %}
